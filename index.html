<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control de Importaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#eef2f5; --panel:#ffffff; --ink:#14202b; --muted:#5b6b78; --line:#d5dde4;
  --harbor:#123a5a; --harbor-soft:#e1ebf3; --signal:#e0661a;
  --ok:#1f8a5b; --ok-bg:#e2f4ea; --warn:#b07400; --warn-bg:#fdf1d6; --bad:#c23b2e; --bad-bg:#fbe4e1; --idle:#6b5ca5; --idle-bg:#ece8f8;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif; --f-body:"Barlow",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d151c; --panel:#15212b; --ink:#e3eaf0; --muted:#93a3b1; --line:#26343f;
  --harbor:#7fb2dc; --harbor-soft:#1b2f40; --signal:#f08a45;
  --ok:#55c48f; --ok-bg:#16302a; --warn:#e2b04a; --warn-bg:#332a12; --bad:#ef7a6c; --bad-bg:#3a1d1a; --idle:#b4a6ee; --idle-bg:#27223d; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
[hidden]{display:none!important}
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--signal)}
h1{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;margin:4px 0 0;color:var(--harbor)}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.userbox{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;color:var(--muted);font:600 13px var(--f-body);padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--harbor);color:var(--panel)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.linkbtn{border:0;background:none;color:var(--harbor);font:600 13px var(--f-body);cursor:pointer;padding:0;text-decoration:underline}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;gap:2px}
.kpi[aria-pressed="true"]{border-color:var(--harbor);box-shadow:inset 0 0 0 1px var(--harbor)}
.kpi .n{font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi.bad .n{color:var(--bad)} .kpi.warn .n{color:var(--warn)} .kpi.idle .n{color:var(--idle)}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi.money{grid-column:1/-1}}

.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h2{font-family:var(--f-display);font-size:20px;font-weight:600;margin:0}
.search{padding:7px 10px;border:1px solid var(--line);border-radius:6px;font:14px var(--f-body);background:var(--panel);color:var(--ink);width:100%}
.list{display:flex;flex-direction:column;max-height:75vh;overflow:auto}
.row{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:12px;padding:12px 16px 12px 0;border:0;border-bottom:1px solid var(--line);cursor:pointer;background:none;text-align:left;font:inherit;color:inherit;width:100%}
.row[aria-current="true"]{background:var(--harbor-soft)}
.stripe{border-radius:0 3px 3px 0}
.stripe.ok{background:var(--ok)} .stripe.warn{background:var(--warn)} .stripe.bad{background:var(--bad)} .stripe.idle{background:var(--idle)} .stripe.done{background:var(--line)}
.r-top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.po{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.prov{font-weight:600}
.r-desc{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-stage{font-size:13px;margin-top:4px}
.r-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.idle{background:var(--idle-bg);color:var(--idle)} .pill.done{background:var(--harbor-soft);color:var(--muted)}
.mini{font-family:var(--f-mono);font-size:11px;color:var(--muted)}

.detail{padding:16px;display:flex;flex-direction:column;gap:18px}
.d-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.d-head h3{font-family:var(--f-display);font-size:26px;font-weight:700;margin:2px 0 0;line-height:1.05}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.sec-t{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.src{font-family:var(--f-mono);font-size:10px;letter-spacing:.04em;text-transform:none;padding:1px 6px;border-radius:4px;background:var(--harbor-soft);color:var(--harbor)}
.src.m{background:var(--warn-bg);color:var(--warn)}
.route-wrap{overflow-x:auto}
.route{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));min-width:640px;padding-bottom:4px}
.stop{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:58px}
.stop::before{content:"";position:absolute;top:7px;left:-50%;width:100%;height:3px;background:var(--line)}
.stop:first-child::before{display:none}
.stop.past::before,.stop.cur::before{background:var(--harbor)}
.dot{width:16px;height:16px;border-radius:50%;border:3px solid var(--line);background:var(--panel);z-index:1}
.stop.past .dot{background:var(--harbor);border-color:var(--harbor)}
.stop.cur .dot{background:var(--signal);border-color:var(--signal)}
.stop span{font-size:10.5px;line-height:1.15;text-align:center;color:var(--muted)}
.stop.cur span{color:var(--ink);font-weight:600}
.next{border-left:4px solid var(--signal);background:var(--harbor-soft);padding:10px 14px;border-radius:0 8px 8px 0;display:flex;flex-direction:column;gap:2px}
.next.bad{border-color:var(--bad);background:var(--bad-bg)}
.next .when{font-family:var(--f-mono);font-size:12px;font-weight:600}
.alert{background:var(--warn-bg);color:var(--warn);padding:8px 12px;border-radius:8px;font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px}
.kv .k{font-size:11.5px;color:var(--muted)}
.kv .v{font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.mono{font-family:var(--f-mono);font-size:13px}
.notes{white-space:pre-wrap;font-size:13px;background:var(--bg);border-radius:8px;padding:10px 12px;margin:0}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--ok)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;border-bottom:1px solid var(--line);padding:6px 8px 6px 0}
td{padding:7px 8px 7px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
.hist{display:flex;flex-direction:column;gap:8px;font-size:13px}
.hist div{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px}
.hist .t{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.empty{color:var(--muted);font-size:13px;font-style:italic}

form.upd{border:1px dashed var(--warn);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
input,select,textarea{font:14px var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
textarea{min-height:56px;resize:vertical}
.btn{background:var(--harbor);color:var(--panel);border:0;border-radius:8px;padding:9px 16px;font:600 14px var(--f-body);cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.msg{font-size:13px;font-weight:600}
.msg.ok{color:var(--ok)} .msg.err{color:var(--bad)}

.login{max-width:380px;margin:12vh auto 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:14px}
.loading{padding:24px;color:var(--muted)}
.logo{display:block;height:64px;width:auto;background:#fff;border-radius:8px;padding:4px 8px}
.login .logo{height:auto;width:220px;align-self:center}
.brand{display:flex;gap:16px;align-items:center;flex-wrap:wrap}

</style>
</head>

<script>
// ===================== CONFIGURACIÓN =====================
const SUPABASE_URL = "https://wiqnfnlnsdnkxgshchjg.supabase.co";
const SUPABASE_KEY = "sb_publishable_Rk88NYc5jpdJiTQgUKViZA_0VvpbRpE";
const DIAS_SIN_ACTUALIZAR = 10;
const ETAPAS = ["OC emitida","Anticipo pagado","En producción","Embarcada (espera BL)","BL recibido","En tránsito","Arribo a puerto","Aforo / aduana","Nacionalizada","En bodega","Liquidada"];
const RECEPCION = {full:"Completa", partial:"Parcial"};
const LIQ_ESTADO = {draft:"Borrador", calculate:"Calculada", done:"Cerrada"};
// =========================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
let datos = [], sel = null, soloActivas = true, filtro = null, usuario = "";

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt$ = n => Number(n || 0).toLocaleString("es-EC", {minimumFractionDigits:2, maximumFractionDigits:2});
const hoyStr = () => new Date().toLocaleDateString("en-CA", {timeZone:"America/Guayaquil"});
const ddmm = s => s ? `${s.slice(8,10)}/${s.slice(5,7)}/${s.slice(0,4)}` : "—";
const dias = s => Math.round((new Date(s.slice(0,10)+"T12:00:00") - new Date(hoyStr()+"T12:00:00")) / 864e5);
const fechaHora = s => s ? new Date(s).toLocaleString("es-EC", {timeZone:"America/Guayaquil", day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit"}) : "—";

function estado(x){
  if(!x.activa) return {k:"done", t:"Cerrada"};
  if(x.proxima_gestion && dias(x.proxima_gestion) < 0) return {k:"bad", t:`Gestión vencida ${-dias(x.proxima_gestion)} d`};
  if(x.proxima_gestion && dias(x.proxima_gestion) <= 1) return {k:"warn", t: dias(x.proxima_gestion) === 0 ? "Gestión hoy" : "Gestión mañana"};
  const sinAct = -dias(x.actualizado_en);
  if(sinAct > DIAS_SIN_ACTUALIZAR) return {k:"idle", t:`Sin actualizar ${sinAct} d`};
  if(!x.proxima_gestion) return {k:"idle", t:"Sin próxima gestión"};
  return {k:"ok", t:"Al día"};
}

// ---------- Sesión ----------
async function iniciar(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ $("loginForm").hidden = false; $("app").hidden = true; return; }
  usuario = session.user.email;
  $("userEmail").textContent = usuario;
  $("loginForm").hidden = true; $("app").hidden = false;
  await cargar();
}
$("loginForm").onsubmit = async e => {
  e.preventDefault();
  $("lg-btn").disabled = true; $("lg-msg").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email:$("lg-email").value.trim(), password:$("lg-pass").value });
  $("lg-btn").disabled = false;
  if(error){ $("lg-msg").textContent = "Correo o contraseña incorrectos."; return; }
  iniciar();
};
$("logout").onclick = async () => { await sb.auth.signOut(); location.reload(); };

// ---------- Datos ----------
async function cargar(){
  const { data, error } = await sb.from("vw_importaciones").select("*").order("fecha_orden", {ascending:false});
  if(error){ $("list").innerHTML = `<div class="loading">No se pudo leer: ${esc(error.message)}</div>`; return; }
  datos = data;
  const sync = datos.map(d => d.odoo_sync_en).filter(Boolean).sort().pop();
  $("subt").textContent = `Datos de Odoo al ${fechaHora(sync)}`;
  if(!sel){ const primera = datos.find(d => d.activa); sel = primera ? primera.po_id : null; }
  render();
}

function visibles(){
  const q = $("q").value.trim().toLowerCase();
  const orden = {bad:0, warn:1, idle:2, ok:3, done:4};
  return datos
    .filter(x => !soloActivas || x.activa)
    .filter(x => !filtro || (filtro === "revisar" ? x.revisar_pagos : estado(x).k === filtro))
    .filter(x => !q || [x.po_id, x.proveedor, x.referencia_proveedor, x.numero_bl].join(" ").toLowerCase().includes(q))
    .sort((a,b) => orden[estado(a).k] - orden[estado(b).k] || (a.proxima_gestion||"9").localeCompare(b.proxima_gestion||"9"));
}

function renderKpis(){
  const act = datos.filter(x => x.activa);
  const c = k => act.filter(x => estado(x).k === k).length;
  const saldo = act.filter(x => !x.revisar_pagos).reduce((s,x) => s + Math.max(Number(x.saldo),0), 0);
  const items = [
    [null, "", act.length, "Importaciones activas"],
    ["warn", "warn", c("warn"), "Gestión hoy / mañana"],
    ["bad", "bad", c("bad"), "Gestiones vencidas"],
    ["idle", "idle", c("idle"), "Sin gestión o sin actualizar"],
    ["money", "money", "$ " + fmt$(saldo), "Saldo por pagar (activas)"]
  ];
  $("kpis").innerHTML = items.map(([f,cls,n,l]) =>
    `<button class="kpi ${cls}" data-f="${f??""}" aria-pressed="${f && f!=="money" && filtro===f}"><span class="n">${n}</span><span class="l">${l}</span></button>`).join("");
  document.querySelectorAll(".kpi").forEach(b => b.onclick = () => {
    const f = b.dataset.f;
    filtro = (!f || f === "money" || filtro === f) ? null : f;
    render();
  });
}

function renderList(){
  const rows = visibles();
  $("list").innerHTML = rows.map(x => { const e = estado(x); return `
    <button class="row" data-id="${esc(x.po_id)}" aria-current="${x.po_id===sel}">
      <span class="stripe ${e.k}"></span>
      <span style="min-width:0">
        <span class="r-top"><span class="po">${esc(x.po_id)}</span><span class="prov">${esc(x.proveedor)}</span></span>
        <div class="r-desc">${esc(x.referencia_proveedor || "")}</div>
        <div class="r-stage">${esc(x.etapa)}${x.eta && x.activa ? ` · <span class="mini">ETA ${ddmm(x.eta)}</span>` : ""}</div>
      </span>
      <span class="r-right"><span class="pill ${e.k}">${e.t}</span>${x.revisar_pagos ? `<span class="pill warn">Revisar pagos</span>` : ""}${x.proxima_gestion && x.activa ? `<span class="mini">próx. ${ddmm(x.proxima_gestion)}</span>` : ""}</span>
    </button>`; }).join("") || `<div class="loading">Nada con este filtro.</div>`;
  document.querySelectorAll(".row").forEach(r => r.onclick = () => {
    sel = r.dataset.id; render();
    if(innerWidth < 900) $("detail").scrollIntoView({behavior:"smooth"});
  });
}

async function renderDetail(){
  const x = datos.find(d => d.po_id === sel);
  if(!x){ $("detail").innerHTML = `<div class="loading">Selecciona una importación.</div>`; return; }
  const e = estado(x), etapaIdx = ETAPAS.indexOf(x.etapa);
  const total = Number(x.total), pagado = Number(x.pagado), pct = total ? Math.min(100, Math.round(pagado/total*100)) : 0;
  const route = ETAPAS.map((s,i) => `<div class="stop ${i<etapaIdx?"past":i===etapaIdx?"cur":""}"><div class="dot"></div><span>${s}</span></div>`).join("");
  const d = x.proxima_gestion ? dias(x.proxima_gestion) : null;
  const nextBox = x.proxima_gestion ? `<div class="next ${d<0?"bad":""}"><span class="when">Próxima gestión · ${ddmm(x.proxima_gestion)} ${d<0?"(vencida)":d===0?"(hoy)":d===1?"(mañana)":""}</span><span>${esc(x.accion_pendiente || "")}</span></div>` : "";

  $("detail").innerHTML = `
  <div class="detail">
    <div class="d-head">
      <div><div class="po">${esc(x.po_id)} · OC del ${ddmm(x.fecha_orden)}</div><h3>${esc(x.proveedor)}</h3><div class="sub">${esc(x.referencia_proveedor || "")}</div></div>
      <div class="pills"><span class="pill ${e.k}">${e.t}</span>${x.etapa_origen==="sugerida" ? `<span class="pill idle">Etapa sugerida</span>` : ""}</div>
    </div>
    <div><div class="sec-t">Etapa actual <span class="src m">Compras</span></div><div class="route-wrap"><div class="route">${route}</div></div></div>
    ${nextBox}
    <form class="upd" id="upd">
      <div class="sec-t">Actualizar seguimiento <span class="src m">lo llena Compras</span></div>
      <div class="fgrid">
        <label for="u-etapa">Etapa<select id="u-etapa">${ETAPAS.map(s => `<option ${s===x.etapa?"selected":""}>${s}</option>`).join("")}</select></label>
        <label for="u-bl">N° de BL<input id="u-bl" value="${esc(x.numero_bl)}"></label>
        <label for="u-fbl">Fecha del BL<input type="date" id="u-fbl" value="${x.fecha_bl||""}"></label>
        <label for="u-nav">Naviera / forwarder<input id="u-nav" value="${esc(x.naviera_forwarder)}"></label>
        <label for="u-etd">ETD (zarpe)<input type="date" id="u-etd" value="${x.etd||""}"></label>
        <label for="u-eta">ETA (arribo)<input type="date" id="u-eta" value="${x.eta||""}"></label>
        <label for="u-prox">Próxima gestión<input type="date" id="u-prox" value="${x.proxima_gestion||""}"></label>
      </div>
      <label for="u-acc">Qué hay que hacer<input id="u-acc" value="${esc(x.accion_pendiente)}" placeholder="Ej. Pedir copia del BL al proveedor"></label>
      <label for="u-nota">Nota para el historial<textarea id="u-nota" placeholder="Ej. Proveedor envió draft del BL"></textarea></label>
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button class="btn" type="submit" id="u-btn">Guardar seguimiento</button><span class="msg" id="u-msg"></span></div>
    </form>
    <div><div class="sec-t">Logística <span class="src m">Compras</span> <span class="src">Odoo</span></div>
      <div class="grid2">
        <div class="kv"><div class="k">N° de BL</div><div class="v mono">${esc(x.numero_bl) || "Pendiente"}</div></div>
        <div class="kv"><div class="k">Fecha BL</div><div class="v mono">${ddmm(x.fecha_bl)}</div></div>
        <div class="kv"><div class="k">ETD / ETA</div><div class="v mono">${ddmm(x.etd)} → ${ddmm(x.eta)}</div></div>
        <div class="kv"><div class="k">Naviera / forwarder</div><div class="v">${esc(x.naviera_forwarder) || "—"}</div></div>
        <div class="kv"><div class="k">Recepción en bodega</div><div class="v">${RECEPCION[x.estado_recepcion] || "Sin recibir"}</div></div>
        <div class="kv"><div class="k">Liquidación</div><div class="v">${x.liquidacion ? `${esc(x.liquidacion)} · ${LIQ_ESTADO[x.liquidacion_estado] || esc(x.liquidacion_estado)}` : "Sin liquidación"}</div></div>
      </div></div>
    <div><div class="sec-t">Orden de compra y pagos <span class="src">Odoo · flujo de caja</span></div>
      ${x.revisar_pagos ? `<div class="alert">Lo pagado ligado a esta OC supera su total. Puede ser un pago compartido con otra OC: revisar antes de usar el saldo.</div>` : ""}
      <div class="grid2" style="margin-top:8px">
        <div class="kv"><div class="k">Total OC (USD)</div><div class="v">${fmt$(total)}</div></div>
        <div class="kv"><div class="k">Pagado</div><div class="v">${fmt$(pagado)}</div></div>
        <div class="kv"><div class="k">Saldo</div><div class="v" style="color:${x.revisar_pagos?"var(--warn)":Number(x.saldo)>0.05?"var(--bad)":"var(--ok)"}">${x.revisar_pagos ? "Revisar" : fmt$(x.saldo)}</div></div>
      </div>
      <div class="bar"><i style="width:${pct}%"></i></div><div class="mini">${pct}% pagado</div>
      <div id="pagos" style="margin-top:10px"><div class="empty">Cargando pagos…</div></div>
    </div>
    <div><div class="sec-t">Términos de la OC <span class="src">Odoo</span></div>
      <div id="cuotas"></div>
      ${x.notas_oc || x.comentarios_forma_pago ? `<pre class="notes">${esc(x.notas_oc || x.comentarios_forma_pago)}</pre>` : `<div class="empty">Sin términos registrados en Odoo. Compras debe llenar "Comentarios Formas de Pago" en la OC.</div>`}
    </div>
    <div><div class="sec-t">Historial · última actualización ${fechaHora(x.actualizado_en)} · ${esc(x.actualizado_por || "")}</div>
      <div class="hist" id="hist"><div class="empty">Cargando…</div></div></div>
  </div>`;

  $("upd").onsubmit = ev => { ev.preventDefault(); guardar(x); };

  const [pagos, cuotas, hist] = await Promise.all([
    sb.from("movimientos").select("fecha,concepto,banco,monto").eq("po_id", x.po_id).eq("estado","ejecutado").lt("monto",0).not("oculto","is",true).not("eliminado","is",true).order("fecha"),
    sb.from("oc_forma_pago_sugerida").select("cuota_numero,pct,monto,descripcion,fecha,estado").eq("po_id", x.po_id).order("cuota_numero"),
    sb.from("importaciones_historial").select("cambio,nota,usuario,creado_en").eq("po_id", x.po_id).order("creado_en",{ascending:false})
  ]);
  if(sel !== x.po_id) return;
  $("pagos").innerHTML = pagos.error ? `<div class="empty">No se pudieron leer los pagos.</div>`
    : pagos.data.length ? `<div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th>Detalle</th><th>Banco</th><th class="r">Monto</th></tr></thead><tbody>${pagos.data.map(p => `<tr><td class="mono">${ddmm(p.fecha)}</td><td>${esc(p.concepto)}</td><td>${esc(p.banco)}</td><td class="r">${fmt$(-p.monto)}</td></tr>`).join("")}</tbody></table></div>`
    : `<div class="empty">Sin pagos registrados.</div>`;
  $("cuotas").innerHTML = (!cuotas.error && cuotas.data.length) ? `<div class="tbl-wrap" style="margin-bottom:10px"><table><thead><tr><th>#</th><th>Cuota</th><th>Fecha</th><th class="r">Monto</th></tr></thead><tbody>${cuotas.data.map(c => `<tr><td>${c.cuota_numero}</td><td>${c.pct!=null?c.pct+"% · ":""}${esc(c.descripcion || "")}</td><td class="mono">${ddmm(c.fecha)}</td><td class="r">${c.monto!=null?fmt$(c.monto):"—"}</td></tr>`).join("")}</tbody></table></div>` : "";
  $("hist").innerHTML = (!hist.error && hist.data.length) ? hist.data.map(h => `<div><span class="t">${fechaHora(h.creado_en)}</span><span><b>${esc(h.usuario || "")}:</b> ${esc(h.cambio)}${h.nota ? ` · ${esc(h.nota)}` : ""}</span></div>`).join("") : `<div class="empty">Sin cambios registrados todavía.</div>`;
}

async function guardar(x){
  const v = id => $(id).value.trim() || null;
  const nuevo = {
    etapa: $("u-etapa").value, numero_bl: v("u-bl"), fecha_bl: v("u-fbl"), naviera_forwarder: v("u-nav"),
    etd: v("u-etd"), eta: v("u-eta"), proxima_gestion: v("u-prox"), accion_pendiente: v("u-acc")
  };
  const nombres = {etapa:"Etapa", numero_bl:"BL", fecha_bl:"Fecha BL", naviera_forwarder:"Naviera", etd:"ETD", eta:"ETA", proxima_gestion:"Próxima gestión", accion_pendiente:"Acción"};
  const cambios = Object.keys(nuevo).filter(k => (nuevo[k] || null) !== (x[k] || null))
    .map(k => `${nombres[k]}: ${["fecha_bl","etd","eta","proxima_gestion"].includes(k) ? ddmm(nuevo[k]) : (nuevo[k] || "vacío")}`);
  const nota = v("u-nota");
  if(!cambios.length && !nota){ $("u-msg").className = "msg err"; $("u-msg").textContent = "No hay cambios para guardar."; return; }

  $("u-btn").disabled = true; $("u-msg").textContent = "";
  const upd = {...nuevo, actualizado_por: usuario, actualizado_en: new Date().toISOString()};
  if(nuevo.etapa !== x.etapa) upd.etapa_origen = "manual";
  const r1 = await sb.from("importaciones_seguimiento").update(upd).eq("po_id", x.po_id);
  if(r1.error){ $("u-btn").disabled = false; $("u-msg").className = "msg err"; $("u-msg").textContent = "No se guardó: " + r1.error.message; return; }
  const r2 = await sb.from("importaciones_historial").insert({po_id: x.po_id, cambio: cambios.join(" · ") || "Revisado sin cambios", nota, usuario});
  await cargar();
  $("u-msg").className = r2.error ? "msg err" : "msg ok";
  $("u-msg").textContent = r2.error ? "Se guardó el seguimiento, pero no el historial: " + r2.error.message : "Guardado.";
}

function render(){
  $("f-act").setAttribute("aria-pressed", soloActivas);
  $("f-all").setAttribute("aria-pressed", !soloActivas);
  renderKpis(); renderList(); renderDetail();
}
$("f-act").onclick = () => { soloActivas = true; render(); };
$("f-all").onclick = () => { soloActivas = false; filtro = null; render(); };
$("q").oninput = () => renderList();

iniciar();
</script>
</body>
</html>
